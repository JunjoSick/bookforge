version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    ignore:
      # rusqlite >=0.40 depends on a libsqlite3-sys that uses `cfg_select!`,
      # which is not available at our MSRV of 1.88 (docs/msrv-audit.md). Taking
      # it would mean raising the floor and dropping the distro toolchains that
      # audit deliberately kept support for. Revisit when the MSRV moves for an
      # independent reason, or if an advisory lands against the 0.3x line.
      - dependency-name: rusqlite
        versions: [">=0.40"]
    groups:
      rust-patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    ignore:
      # release.yml is GENERATED by cargo-dist, and its action pins are owned by
      # [dist.github-action-commits] in dist-workspace.toml (the SHA pinning added
      # in v2.6.1 so the pins survive regeneration). When dependabot edits the
      # generated file directly, `dist plan` sees release.yml drift from what dist
      # would emit and fails the Release workflow with exit 255 — that is what
      # happened to PR #54. Bump these four in dist-workspace.toml instead, then
      # regenerate release.yml.
      #
      # Tradeoff, deliberately accepted: dependabot will no longer announce new
      # versions of these four actions at all, so a major bump has to be noticed
      # by hand. ci.yml and security.yml are unaffected — they track the floating
      # `actions/checkout@v7` tag rather than a SHA, so they pick up patch and
      # minor releases without dependabot's help and only need attention when the
      # major moves.
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: actions/attest
