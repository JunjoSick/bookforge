name: Installer smoke (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/project-remediation

permissions:
  actions: read
  contents: read

jobs:
  unix-installers:
    name: ${{ matrix.target }} installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: artifacts-build-local-aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: artifacts-build-local-x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: artifacts-build-local-aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: artifacts-build-local-x86_64-unknown-linux-gnu
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN_ID: "29281323279"
    steps:
      - name: Download generated installer and native archive
        shell: bash
        run: |
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name artifacts-build-global \
            --dir artifacts/global
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ matrix.artifact }}" \
            --dir artifacts/local

      - name: Install through generated shell installer
        shell: bash
        run: |
          set -euo pipefail
          serve="$RUNNER_TEMP/bookforge-installer-assets"
          install="$RUNNER_TEMP/bookforge-installer-root"
          mkdir -p "$serve" "$install"
          cp artifacts/global/bookforge-cli-installer.sh "$serve/"
          cp artifacts/local/* "$serve/"

          python3 -m http.server 18765 \
            --bind 127.0.0.1 \
            --directory "$serve" \
            >"$RUNNER_TEMP/bookforge-installer-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:18765/bookforge-cli-installer.sh" \
              >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          test "$ready" = true

          export BOOKFORGE_CLI_DOWNLOAD_URL="http://127.0.0.1:18765"
          export BOOKFORGE_CLI_INSTALL_DIR="$install"
          export BOOKFORGE_CLI_NO_MODIFY_PATH=1
          export BOOKFORGE_CLI_DISABLE_UPDATE=1
          sh "$serve/bookforge-cli-installer.sh"

          installed_version=$("$install/bin/bookforge" --version)
          echo "installed version: $installed_version"
          test "$installed_version" = "bookforge 2.4.0"
