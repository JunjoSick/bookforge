name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Pre-existing too_many_arguments warnings are tolerated; everything else fails the job.
      - run: cargo clippy --all-targets --all-features -- -A clippy::too_many_arguments -D warnings

  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lifecycle tests create synthetic EPUB fixtures and run in clean clones.
      - run: cargo test --workspace --locked

  test-windows:
    name: test (windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      # Verifies the rust-version pin in Cargo.toml. If this job fails, either
      # the codebase started using an API newer than 1.88 or a dependency's
      # transitive MSRV climbed. See docs/msrv-audit.md before raising the floor.
      - run: cargo check --workspace --all-targets --locked

  corpus-small:
    name: corpus (small)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
      - name: Install EPUBCheck 5.3.0
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output .tools/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q .tools/epubcheck.zip -d .tools
          echo "BOOKFORGE_EPUBCHECK=$GITHUB_WORKSPACE/.tools/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: bash scripts/corpus-fetch.sh small
      - run: bash scripts/corpus-smoke.sh small

  corpus-large:
    name: corpus (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
      - name: Install EPUBCheck 5.3.0
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output .tools/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q .tools/epubcheck.zip -d .tools
          echo "BOOKFORGE_EPUBCHECK=$GITHUB_WORKSPACE/.tools/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: bash scripts/corpus-fetch.sh large
      - run: bash scripts/corpus-smoke.sh large
