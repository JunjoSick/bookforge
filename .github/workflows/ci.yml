name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Least privilege: every job here only reads the repo; none needs elevated
# tokens (checkouts run with persist-credentials: false).
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Exact Rust for every non-MSRV job. With -D warnings, a floating `stable`
  # turned all of CI red from 2026-10-02 to 10-20 when Rust 1.99 deprecated a
  # std method. Bump this deliberately, in its own PR (see CONTRIBUTING.md).
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/verify.sh fmt

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Treat all clippy warnings as errors.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/verify.sh clippy

  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Lifecycle tests create synthetic EPUB fixtures and run in clean clones.
      - run: bash scripts/verify.sh test
      - run: bash scripts/verify.sh features
      - run: npm ci --prefix qa/browser
      - name: Install Chromium
        working-directory: qa/browser
        run: npx --no-install playwright install --with-deps chromium
      - run: bash scripts/verify.sh browser
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-qa
          path: .qa/runs/
          include-hidden-files: true
          retention-days: 7

  test-windows:
    name: test (windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-msvc
      - run: cargo test --workspace --locked

  clippy-macos:
    name: clippy (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos
      # Code gated to macOS (non-Linux Unix) never compiles on the Linux and
      # Windows jobs. The v3.0.0 release build was the first to reach it and
      # failed on a compile error, so the release runner's OS is linted here.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: msrv (1.88.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv-1.88
      # Verifies the rust-version pin in Cargo.toml. If this job fails, either
      # the codebase started using an API newer than 1.88 or a dependency's
      # transitive MSRV climbed. See docs/msrv-audit.md before raising the floor.
      - run: cargo check --workspace --all-targets --locked

  corpus-small:
    name: corpus (small)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          # Exercise the fail-closed signature check instead of a cached JDK.
          force-download: true
          verify-signature: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install EPUBCheck 5.3.0
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output .tools/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          # Pinned release; sha256 verified (computed from the official w3c/epubcheck v5.3.0 asset).
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  .tools/epubcheck.zip" | sha256sum --check --strict -
          unzip -q .tools/epubcheck.zip -d .tools
          echo "BOOKFORGE_EPUBCHECK=$GITHUB_WORKSPACE/.tools/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: bash scripts/corpus-fetch.sh small
      - run: bash scripts/corpus-smoke.sh small

  corpus-large:
    name: corpus (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install EPUBCheck 5.3.0
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output .tools/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          # Pinned release; sha256 verified (computed from the official w3c/epubcheck v5.3.0 asset).
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  .tools/epubcheck.zip" | sha256sum --check --strict -
          unzip -q .tools/epubcheck.zip -d .tools
          echo "BOOKFORGE_EPUBCHECK=$GITHUB_WORKSPACE/.tools/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: bash scripts/corpus-fetch.sh large
      - run: bash scripts/corpus-smoke.sh large
