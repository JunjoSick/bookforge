[workspace]
members = [
    "crates/bookforge-audio",
    "crates/bookforge-cli",
    "crates/bookforge-core",
    "crates/bookforge-epub",
    "crates/bookforge-llm",
    "crates/bookforge-pdf",
    "crates/bookforge-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/JunjoSick/bookforge"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
getrandom = "0.4"
toml = "1.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
console = "0.16"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
quick-xml = { version = "0.41", features = ["escape-html"] }
# Trimmed to deflate only: EPUBs need Deflated + Stored (built-in), so avoid
# pulling every codec (bzip2/zstd/lzma/aes-crypto chains incl. zstd-sys's C
# build) and zip's optional `time`. The zlib-rs backend keeps flate2 pure-Rust
# (no C toolchain) and matches the backend the old default features already used.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Held below 0.40 deliberately: 0.40 pulls a libsqlite3-sys that uses the
# `cfg_select!` macro, which does not exist in our MSRV (see docs/msrv-audit.md
# for why the floor is 1.88 and what it buys). Raising past 0.39 means raising
# the MSRV. Dependabot is told to skip >=0.40 in .github/dependabot.yml.
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }
base64 = "0.23"
# Advisory OS file locks (`flock` on Unix) for the retry-failed single-winner
# claim. Tied to the process lifetime: the kernel drops the lock the instant
# the owner dies, which is the only liveness verdict that can never be stale.
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
