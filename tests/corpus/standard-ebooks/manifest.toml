schema_version = 1
description = """
Curated Standard Ebooks fixtures for BookForge structural regression testing.
The files are downloaded on demand and are not committed to this repository.

To keep CI stable, the `url` of each book points at an immutable snapshot
mirrored as a GitHub Release asset (tag `corpus-fixtures-v1`), not at the
mutable Standard Ebooks "latest" download. The original public-domain source
is recorded in `source_url` for provenance. Hashes pin those exact snapshots
and were recorded on 2026-06-30. To refresh the corpus, re-download from
`source_url`, upload to a new `corpus-fixtures-vN` release, and update `url`
plus the hashes here.
"""

