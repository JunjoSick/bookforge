[package]
name = "bookforge-cli"
version = "1.2.1"
description = "CLI-first EPUB translation engine with deterministic structure rebuild and review loop."
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bookforge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bookforge-core = { version = "1.2.1", path = "../bookforge-core", features = ["cli"] }
bookforge-epub = { version = "1.2.1", path = "../bookforge-epub" }
bookforge-llm = { version = "1.2.1", path = "../bookforge-llm" }
bookforge-store = { version = "1.2.1", path = "../bookforge-store" }
clap.workspace = true
console.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
