[package]
name = "bookforge-cli"
version = "3.0.0"
description = "CLI-first EPUB translation engine with deterministic structure rebuild and review loop."
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bookforge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-stream = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true, features = ["multipart"] }
bookforge-audio = { version = "3.0.0", path = "../bookforge-audio" }
bookforge-core = { version = "3.0.0", path = "../bookforge-core", features = ["cli"] }
bookforge-epub = { version = "3.0.0", path = "../bookforge-epub" }
bookforge-llm = { version = "3.0.0", path = "../bookforge-llm" }
bookforge-pdf = { version = "3.0.0", path = "../bookforge-pdf" }
bookforge-store = { version = "3.0.0", path = "../bookforge-store" }
clap.workspace = true
console.workspace = true
futures-core = { version = "0.3", optional = true }
getrandom.workspace = true
indicatif.workspace = true
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip.workspace = true

# Windows-only lifecycle primitives:
# - `MoveFileExW(MOVEFILE_REPLACE_EXISTING)` for the atomic sidecar replace:
#   std's `rename` refuses to overwrite an existing file on Windows, so without
#   this the shared atomic writer would have to delete the previous good state
#   before publishing the new one (crash/power-loss unsafe).
# - `OpenProcess`/`GetExitCodeProcess` for a robust owner-liveness probe: a pid
#   that fails `OpenProcess(ERROR_INVALID_PARAMETER)` is positively dead, which
#   is the only condition under which a stale claim/lease may be reclaimed on
#   Windows (liveness is never inferred from age alone).
# - `LockFileEx`/`OVERLAPPED` for the kernel-backed advisory lock that guards
#   the overrides document (no removable-lock-file protocol).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

# `flock(2)` for the same kernel-backed advisory lock on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["tui", "serve"]
# Terminal UI (`--ui tui` and the `watch` command). Default-on; build with
# --no-default-features to drop the ratatui dependency for a minimal binary.
tui = ["dep:ratatui"]
# Local web dashboard (the `serve` command). Default-on so release binaries can
# be dogfooded by non-developers; build with --no-default-features to drop the
# axum/hyper dependency for a minimal binary.
serve = [
    "dep:axum",
    "dep:async-stream",
    "dep:futures-core",
    "tokio/net",
    "tokio/process",
]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
quick-xml.workspace = true
tempfile = "3"
tower = "0.5"
zip.workspace = true
